<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>{% block title %}TiPTiB{% endblock %}</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <div class="page">
        {% if show_back_button %}
          <div class="top-actions row">
            <button class="back-button" type="button" data-back-button aria-label="Go back"{% if back_url %} data-back-url="{{ back_url }}"{% endif %}>
              <span aria-hidden="true">&larr;</span>
              <span>Back</span>
            </button>
            <div class="top-actions-right">
              {% block top_actions %}{% endblock %}
            </div>
          </div>
        {% endif %}
        {% block content %}{% endblock %}
      </div>
    </main>
    <nav class="bottom-nav" aria-label="Primary">
      <a class="nav-item {{ 'active' if active == 'dashboard' else '' }}" href="/dashboard">Today</a>
      <a class="nav-item {{ 'active' if active == 'lists' else '' }}" href="/lists">Lists</a>
      <a class="nav-item nav-add {{ 'active' if active == 'add' else '' }}" href="/items/new" aria-label="Add item" title="Add item">
        <svg class="nav-plus-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
      </a>
      <a class="nav-item {{ 'active' if active == 'accounts' else '' }}" href="/accounts">Accounts</a>
      <a class="nav-item {{ 'active' if active == 'settings' else '' }}" href="/settings">Settings</a>
    </nav>
    <script src="/static/app.js" defer></script>
  </body>
</html>
