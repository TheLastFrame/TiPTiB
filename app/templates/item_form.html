{% extends "base.html" %}
{% block title %}Add item · TiPTiB{% endblock %}
{% block content %}
  <section class="hero">
    <span class="eyebrow">New wish</span>
    <h1>Add a plan</h1>
  </section>
  <section class="panel">
    <form class="form" method="post" action="/items">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      {% include "partials/item_fields.html" %}
      <button class="button" type="submit">Create item</button>
    </form>
  </section>
{% endblock %}
